# Cross-compiles Android gamescope for aarch64-linux-android. A test build:
# nothing is packaged or uploaded.
#
# Toolchain and userland setup mirror proton-wine: NDK r27d plus the prebuilt
# Termux tree from GameNative/termux-on-gha, which supplies the bionic dev
# packages (cairo, pixman, lcms2, libdrm, xkbcommon, wayland, X11/xcb,
# EGL/GLES/GBM, Vulkan) that android/build-gamescope.sh links against.
#
# Xwayland is built first because wlroots resolves its xwayland dependency
# from the xwayland.pc that build installs. The glamor Mesa stage Xwayland
# runs on (android/mesa-glamor) is built next and uploaded as an artifact.
name: Android build (test)

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'meson.build'
      - 'subprojects/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  gamescope:
    runs-on: ubuntu-24.04

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            meson \
            ninja-build \
            python3 \
            ccache \
            wget \
            unzip \
            libwayland-bin \
            glslang-tools

      - name: Cache termuxfs download
        uses: actions/cache@v4
        with:
          path: ~/termuxfs-aarch64.tar
          key: termuxfs-build-20260218

      - name: Download and extract termuxfs
        run: |
          [ -f "$HOME/termuxfs-aarch64.tar" ] || \
            wget -O "$HOME/termuxfs-aarch64.tar" \
              https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          mkdir -p "$HOME/termuxfs/aarch64"
          tar -xf "$HOME/termuxfs-aarch64.tar" -C "$HOME/termuxfs/aarch64"

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/Android/Sdk/ndk"
          cd "$HOME/Android/Sdk/ndk"
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      # wlroots requires a build-machine wayland-scanner of 1.24 or newer, and
      # the runner image ships 1.22; wayland-protocols also refuses to generate
      # from its own XML when the scanner is older than the protocols.
      - name: Install a current wayland-scanner
        run: |
          sudo apt-get install -y libffi-dev
          curl -fsSL -o /tmp/wayland.tar.xz \
            https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.26.0/downloads/wayland-1.26.0.tar.xz
          tar -xf /tmp/wayland.tar.xz -C /tmp
          meson setup /tmp/wayland-1.26.0/build /tmp/wayland-1.26.0 \
            --prefix=/tmp/host-wayland -Ddocumentation=false -Dtests=false
          ninja -C /tmp/wayland-1.26.0/build install
          sudo ln -sf /tmp/host-wayland/bin/wayland-scanner /usr/bin/wayland-scanner
          sudo cp "$(find /tmp/host-wayland -name wayland-scanner.pc | head -1)" \
            /usr/lib/x86_64-linux-gnu/pkgconfig/wayland-scanner.pc
          wayland-scanner --version

      # wayland-protocols (>= 1.47 for wlroots), libXres, libxkbfile,
      # xcb-util-wm, luajit and hwdata are not in the termux tree.
      - name: Install the missing build dependencies
        run: bash android/ci/termux-prefix.sh

      # wlroots' xwayland dependency resolves from xwayland.pc, which the
      # Xwayland build installs.
      - name: Check out Xwayland
        uses: actions/checkout@v4
        with:
          repository: GameNative/xserver
          ref: xwayland-no-implicit-sync-gamenative
          path: xserver

      - name: Build Xwayland
        working-directory: xserver
        run: |
          # xkbcomp links against the prefix's X11 headers, and the prefix's own
          # pkg-config files no longer name their include root.
          export CPPFLAGS="-I$HOME/termuxfs/aarch64/data/data/com.termux/files/usr/include"
          bash android/build-xwayland.sh
          DESTDIR=/tmp/xwayland-stage ninja -C build-android install
          cp /tmp/xwayland-stage/data/user/0/app.gamenative/files/gamescope/lib/pkgconfig/xwayland.pc \
            "$HOME/termuxfs/aarch64/data/data/com.termux/files/usr/lib/pkgconfig/"

      # bison/flex are the only host tools the Mesa build still needs supplied;
      # it provisions its own meson + Python modules into a venv in its work dir.
      - name: Install the glamor Mesa build tools
        run: sudo apt-get install -y bison flex python3-venv

      - name: Cache the Mesa release tarball
        uses: actions/cache@v4
        with:
          path: ~/mesa-tarball
          key: mesa-tarball-${{ hashFiles('android/mesa-glamor/fetch-mesa.sh') }}

      - name: Cache ccache (glamor Mesa)
        uses: actions/cache@v4
        with:
          path: ~/.ccache-mesa
          key: ccache-mesa-glamor-${{ hashFiles('android/mesa-glamor/**') }}
          restore-keys: |
            ccache-mesa-glamor-

      - name: Build the glamor Mesa stage
        run: |
          export CCACHE_DIR="$HOME/.ccache-mesa"
          export GN_MESA_TARBALL_DIR="$HOME/mesa-tarball"
          bash android/mesa-glamor/build-mesa-glamor.sh
          bash android/check-no-libandroid.sh build-android-mesa-glamor/stage
          ccache -s || true
          tar -C build-android-mesa-glamor/stage -czf mesa-glamor-stage.tar.gz .

      - name: Upload the glamor Mesa stage
        uses: actions/upload-artifact@v4
        with:
          name: mesa-glamor-stage-${{ github.sha }}
          path: mesa-glamor-stage.tar.gz
          if-no-files-found: error

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gamescope-${{ github.sha }}
          restore-keys: |
            ccache-gamescope-

      - name: Configure
        run: bash android/build-gamescope.sh --clean --setup-only

      - name: Build
        run: bash android/build-gamescope.sh

      - name: Upload the gamescope binaries
        uses: actions/upload-artifact@v4
        with:
          name: gamescope-android-${{ github.sha }}
          path: |
            build-android/src/gamescope
            xserver/build-android/hw/xwayland/Xwayland
            build-android/src/gamescopereaper
            xserver/build-android/hw/xwayland/Xwayland
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache -s || true

